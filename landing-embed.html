<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melcochómetro — ejemplo de embed</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           color: #1a1a1a; background: #f5f5f5; }
    .demo-hero { max-width: 720px; margin: 0 auto; padding: 40px 20px 8px; text-align: center; }
    .demo-hero h1 { font-size: 1.9rem; margin: 0 0 8px; }
    .demo-hero p { color: #555; line-height: 1.5; margin: 0 auto; max-width: 46ch; }
    .demo-nota { max-width: 720px; margin: 24px auto 48px; padding: 0 20px;
                 color: #888; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

  <!-- Contexto de ejemplo del landing (esto lo reemplaza el diseño real de
       El Comercio; sirve solo para ver el widget en situación). -->
  <div class="demo-hero">
    <h1>¿Tu pata se merece una chapa?</h1>
    <p>Dale unas pistas y Melcochita se encarga del resto. Escríbelo, escúchalo… y no te piques.</p>
  </div>

  <!-- ===================================================================
       BLOQUE EMBED — esto es lo único que el equipo de El Comercio pega en
       su CMS/landing. Reemplazar la URL `src` por la del despliegue real
       (p.ej. https://melcochometro.onrender.com). Para pruebas locales:
       http://localhost:8000
       =================================================================== -->
  <div style="max-width:480px; margin:0 auto; padding:0 16px;">
    <iframe
      id="melcochometro"
      src="https://melcochometro.onrender.com"
      title="Melcochómetro"
      loading="lazy"
      allow="autoplay; web-share"
      scrolling="no"
      style="width:100%; height:820px; border:0; border-radius:16px;
             box-shadow:0 6px 24px rgba(0,0,0,.12); display:block; background:#fff;">
    </iframe>
  </div>

  <script>
    // Autoajusta el alto del iframe según lo que reporta el Melcochómetro,
    // para que no haya scroll interno ni espacios vacíos entre estados.
    (function () {
      var iframe = document.getElementById("melcochometro");
      var origenWidget;
      try { origenWidget = new URL(iframe.src).origin; } catch (e) { origenWidget = null; }
      window.addEventListener("message", function (e) {
        // Seguridad: solo confiamos en mensajes del propio widget.
        if (origenWidget && e.origin !== origenWidget) return;
        if (e.data && e.data.tipo === "melco-alto" && e.data.alto) {
          iframe.style.height = e.data.alto + "px";
        }
      });
    })();
  </script>
  <!-- ===================== FIN BLOQUE EMBED ============================ -->

  <p class="demo-nota">
    Ejemplo de integración. El widget corre en su propio servidor (FastAPI);
    el landing solo lo incrusta. La voz de Melcochita suena gracias a
    <code>allow="autoplay"</code>.
  </p>

</body>
</html>
